apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  namespace: jobmgr
  labels:
    app: mongo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
        - name: mongo
          image: mongo:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc2
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db-svc
  namespace: jobmgr
  labels:
    app: mongo-db
spec:
  type: ClusterIP
  selector:
    app: mongo-db
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
