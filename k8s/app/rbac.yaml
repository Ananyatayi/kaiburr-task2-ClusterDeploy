apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobmgr-runner
  namespace: jobmgr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jobmgr-exec-role
  namespace: jobmgr
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jobmgr-exec-bind
  namespace: jobmgr
subjects:
  - kind: ServiceAccount
    name: jobmgr-runner
    namespace: jobmgr
roleRef:
  kind: Role
  name: jobmgr-exec-role
  apiGroup: rbac.authorization.k8s.io
